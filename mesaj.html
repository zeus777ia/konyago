<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d7a4f">
<meta name="description" content="KonyaGo iletişim formu — bize yazın.">
<title>Bize yazın | KonyaGo</title>
<link rel="icon" href="assets/img/eagle.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/app.css?v=15">
<link rel="stylesheet" href="assets/css/theme.css?v=2">
<style>
.msg-wrap{max-width:560px;margin:0 auto;padding:12px 0 40px}
.msg-box{padding:18px 16px;border-radius:18px;border:1px solid var(--border);background:var(--white);box-shadow:0 8px 24px rgba(13,122,79,.06)}
.msg-box h1{margin:0 0 4px;font-size:1.25rem;color:var(--green-deep)}
.msg-box .sub{margin:0 0 14px;font-size:.88rem;color:var(--muted)}
.msg-fields{display:grid;gap:10px}
.msg-fields input,.msg-fields select,.msg-fields textarea{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--border);background:var(--bg,#f7faf8);color:var(--text,#1a2e24);font:inherit;box-sizing:border-box}
.msg-fields input:focus,.msg-fields select:focus,.msg-fields textarea:focus{outline:none;border-color:var(--green)}
.msg-fields textarea{min-height:120px;resize:vertical}
.send{margin-top:12px;border:0;border-radius:999px;padding:12px 20px;background:var(--green,#0d7a4f);color:#fff;font:inherit;font-weight:700;cursor:pointer}
.send:disabled{opacity:.6;cursor:wait}
.msg-note{margin:10px 0 0;font-size:.75rem;color:var(--muted);line-height:1.4}
.msg-ok{display:none;margin:0 0 12px;padding:12px 14px;border-radius:12px;background:rgba(13,122,79,.12);border:1px solid rgba(13,122,79,.3);color:var(--green-deep);font-size:.9rem}
.msg-ok.show{display:block}
.hp{position:absolute;left:-9999px;height:0;width:0;opacity:0;overflow:hidden}
</style>
<script>(function(){try{var t=localStorage.getItem("konyago_theme");if(t!=="dark"&&t!=="light"){t=(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light"}document.documentElement.setAttribute("data-theme",t)}catch(e){}})();</script>
</head>
<body>
<header class="site-header">
  <div class="container header-inner">
    <a class="logo" href="index.html"><img class="logo-mark" src="assets/img/eagle.svg" width="44" height="44" alt=""><span class="logo-text"><strong>KonyaGo</strong><small>Mesaj</small></span></a>
    <nav class="nav-desktop"><a href="index.html">Ana</a><a href="iletisim.html">İletişim</a></nav>
  </div>
</header>
<main class="container">
  <div class="msg-wrap">
    <p style="margin:8px 0 12px"><a href="iletisim.html">← İletişim</a></p>
    <div class="msg-ok" id="msgOk">Mesajın alındı. En kısa sürede dönüş yapacağız.</div>
    <div class="msg-box">
      <h1>Bize yazın</h1>
      <p class="sub">KonyaGo iletişim formu · en kısa sürede dönüş</p>
      <form id="contactForm" action="https://formsubmit.co/ajax/cnrtech@outlook.com.tr" method="POST">
        <input type="hidden" name="_subject" value="KonyaGo — yeni iletişim mesajı">
        <input type="hidden" name="_template" value="table">
        <input type="text" name="_honey" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
        <div class="msg-fields">
          <input type="text" name="name" placeholder="Ad Soyad" required maxlength="80" autocomplete="name">
          <input type="email" name="email" placeholder="E-posta" required maxlength="120" autocomplete="email">
          <input type="tel" name="phone" placeholder="Telefon (opsiyonel)" maxlength="30" autocomplete="tel">
          <select name="subject" required>
            <option value="Genel">Konu: Genel</option>
            <option value="Reklam / iş birliği">Reklam / iş birliği</option>
            <option value="Hata bildirimi">Hata bildirimi</option>
            <option value="Öneri">Öneri</option>
            <option value="Teknik destek">Teknik destek</option>
          </select>
          <textarea name="message" placeholder="Mesajınız" required maxlength="4000"></textarea>
        </div>
        <button class="send" type="submit" id="sendBtn">Gönder</button>
        <p class="msg-note">KVKK: Mesajınız yalnızca talebinize dönüş için işlenir. Açık rıza olmadan pazarlama yapılmaz.</p>
      </form>
    </div>
  </div>
</main>
<footer class="site-footer"><div class="container">© 2026 KonyaGo</div></footer>
<script src="assets/js/theme.js?v=2"></script>
<script>
(function () {
  var form = document.getElementById("contactForm");
  var btn = document.getElementById("sendBtn");
  var ok = document.getElementById("msgOk");
  if (!form) return;
  form.addEventListener("submit", function (e) {
    e.preventDefault();
    if (btn) { btn.disabled = true; btn.textContent = "Gönderiliyor…"; }
    fetch(form.action, {
      method: "POST",
      body: new FormData(form),
      headers: { Accept: "application/json" }
    })
      .then(function (r) {
        if (!r.ok) throw new Error("http");
        return r.json().catch(function () { return {}; });
      })
      .then(function () {
        form.reset();
        if (ok) { ok.classList.add("show"); ok.scrollIntoView({ behavior: "smooth", block: "center" }); }
        alert("Mesaj gönderildi. En kısa sürede dönüş yapacağız.");
      })
      .catch(function () {
        form.action = "https://formsubmit.co/cnrtech@outlook.com.tr";
        form.submit();
      })
      .finally(function () {
        if (btn) { btn.disabled = false; btn.textContent = "Gönder"; }
      });
  });
})();
</script>
</body>
</html>
