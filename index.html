<style>
.ilce-strip{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:12px 0}

.ilce-pill{display:block;text-align:center;padding:12px 8px;border-radius:14px;background:var(--green-soft);border:1px solid var(--border);color:var(--green-deep);font-weight:700;font-size:.85rem;text-decoration:none}

.quick-search input{flex:1;min-width:180px;padding:12px 14px;border:1.5px solid var(--border);border-radius:999px;font:inherit;font-size:.92rem;background:var(--white);color:var(--text)}

.hot-item strong{color:var(--green-deep);display:block;margin-bottom:2px}
