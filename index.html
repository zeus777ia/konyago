<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d7a4f">
<title>KonyaGo | Konya Gezilecek Yerler, Mutfak, Rota ve Şehir Rehberi</title>
<meta name="description" content="Konya’nın premium şehir rehberi: Mevlana, Sille, etli ekmek, rotalar, tarihçe, nöbetçi eczane, hava ve KonyaGo AI.">
<meta name="robots" content="index, follow, max-image-preview:large">
<link rel="canonical" href="https://konyago.com.tr/">
<link rel="icon" href="assets/img/eagle.svg" type="image/svg+xml">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
<link rel="dns-prefetch" href="https://upload.wikimedia.org">
<link rel="dns-prefetch" href="https://live.staticflickr.com">
<style>
body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#f7faf8;color:#1a2e24;min-height:100vh;display:flex;align-items:center;justify-content:center}
.box{text-align:center;padding:28px;max-width:380px}
.box strong{color:#0a5c3a}.box a{color:#0d7a4f;font-weight:700;text-decoration:none;margin:0 6px}
.spin{width:28px;height:28px;border:3px solid #c5e6d4;border-top-color:#0d7a4f;border-radius:50%;margin:0 auto 14px;animation:s .7s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none;border-top-color:#0d7a4f}}
</style>
</head>
<body>
<div class="box" id="boot">
  <div class="spin" aria-hidden="true"></div>
  <p><strong>KonyaGo</strong> açılıyor…</p>
  <p style="font-size:.82rem;color:#5a7264">Sayfa hazırlanıyor</p>
</div>
<script>
(function () {
  var CACHE_KEY = "konyago_home_html_v21";
  var CSS_CDN = "https://cdn.jsdelivr.net/gh/zeus777ia/konyago@dbab5e0b005bc8995972caf5133b488f32b5ec38/assets/css/app.css";
  var urls = [
    "https://cdn.jsdelivr.net/gh/zeus777ia/konyago@dbab5e0b005bc8995972caf5133b488f32b5ec38/index.html",
    "https://cdn.jsdelivr.net/gh/zeus777ia/konyago@dbab5e0/index.html"
  ];

  function patch(html) {
    html = html.replace(/assets\/js\/app\.js\?v=\d+/g, "assets/js/app.js?v=21");
    /* app.css doğrudan CDN — @import zinciri yok, mobilde daha hızlı */
    html = html.replace(/href="assets\/css\/app\.css\?v=\d+"/g, 'href="' + CSS_CDN + '"');
    html = html.replace(/href="assets\/css\/app\.css"/g, 'href="' + CSS_CDN + '"');
    if (html.indexOf("sponsor.css") < 0) {
      html = html.replace(
        /(href="https:\/\/cdn\.jsdelivr\.net\/gh\/zeus777ia\/konyago@[^"']+app\.css")/,
        '$1\n<link rel="stylesheet" href="assets/css/sponsor.css?v=1">\n<link rel="stylesheet" href="assets/css/perf.css?v=3">'
      );
    } else {
      html = html.replace(/perf\.css\?v=\d+/g, "perf.css?v=3");
    }
    /* Görseller lazy kalsın */
    return html;
  }

  function render(html) {
    document.open();
    document.write(patch(html));
    document.close();
  }

  /* İkinci ziyarette anında aç */
  try {
    var cached = localStorage.getItem(CACHE_KEY);
    if (cached && cached.indexOf("feat-grid") > -1) {
      render(cached);
      /* Arka planda güncelle */
      fetch(urls[0], { cache: "default", mode: "cors" })
        .then(function (r) { return r.ok ? r.text() : null; })
        .then(function (html) {
          if (html && html.indexOf("feat-grid") > -1) {
            try { localStorage.setItem(CACHE_KEY, html); } catch (e) {}
          }
        })
        .catch(function () {});
      return;
    }
  } catch (e) {}

  function go(i) {
    if (i >= urls.length) {
      document.getElementById("boot").innerHTML =
        "<p><strong>Bağlantı sorunu</strong></p>" +
        "<p><a href=\"gezilecek.html\">Gezi</a><a href=\"kesfet.html\">Keşfet</a><a href=\"ai.html\">AI</a></p>";
      return;
    }
    fetch(urls[i], { cache: "default", mode: "cors" })
      .then(function (r) {
        if (!r.ok) throw new Error("http");
        return r.text();
      })
      .then(function (html) {
        if (!html || html.indexOf("feat-grid") < 0) throw new Error("incomplete");
        try { localStorage.setItem(CACHE_KEY, html); } catch (e) {}
        render(html);
      })
      .catch(function () {
        go(i + 1);
      });
  }
  go(0);
})();
</script>
</body>
</html>
