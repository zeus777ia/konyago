<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function(){
  if(typeof L==='undefined'){document.getElementById('map').innerHTML='<p style="padding:24px;text-align:center;color:#5a7264">Harita yüklenemedi.</p>';return;}
  var places=[
    {name:'Mevlana Müzesi (ücretsiz · ~17:00)',lat:37.87056,lng:32.50472,cat:'Müze'},
    {name:'Alaaddin Tepesi',lat:37.8730,lng:32.4925,cat:'Tarih'},
    {name:'İnce Minareli Medrese',lat:37.8728,lng:32.4950,cat:'Selçuklu'},
    {name:'Karatay Medresesi',lat:37.8745,lng:32.4980,cat:'Müze'},
    {name:'Sille',lat:37.9320,lng:32.4030,cat:'Köy'},
    {name:'Çatalhöyük',lat:37.6663,lng:32.8264,cat:'Arkeoloji'},
    {name:'Meram Bağları',lat:37.8380,lng:32.4300,cat:'Doğa'},
    {name:'Tropikal Kelebek Bahçesi',lat:37.9125,lng:32.5120,cat:'Aile'},
    {name:'Japon Parkı',lat:37.8765,lng:32.4780,cat:'Park'},
    {name:'Seyyid Harun Veli Külliyesi',lat:37.4194,lng:31.8453,cat:'Seydişehir'},
    {name:'Seydişehir Kalesi',lat:37.4190,lng:31.8440,cat:'Seydişehir'},
    {name:'Kuğulu Park',lat:37.4198,lng:31.8485,cat:'Seydişehir'},
    {name:'Tınaztepe Mağarası',lat:37.2830,lng:31.8830,cat:'Seydişehir'},
    {name:'Kilistra',lat:37.5480,lng:32.2480,cat:'Antik'},
    {name:'Eflatunpınar',lat:37.8250,lng:31.6780,cat:'Hitit'},
    {name:'Beyşehir Gölü',lat:37.6770,lng:31.7220,cat:'Doğa'},
    {name:'Meke Gölü',lat:37.6850,lng:33.6450,cat:'Doğa'},
    {name:'Akşehir',lat:38.3570,lng:31.4160,cat:'Kültür'}
  ];
  var map=L.map('map').setView([37.87,32.48],11);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'&copy; OSM'}).addTo(map);
  var markers=[],list=document.getElementById('placeList');
  places.forEach(function(p,i){
    var m=L.marker([p.lat,p.lng]).addTo(map);
    var g='https://www.google.com/maps/dir/?api=1&destination='+p.lat+','+p.lng;
    var y='https://yandex.com.tr/maps/?rtext=~'+p.lat+'%2C'+p.lng;
    m.bindPopup('<strong>'+p.name+'</strong><br>'+p.cat+'<br><a href="'+g+'" target="_blank" rel="noopener">Google</a> · <a href="'+y+'" target="_blank" rel="noopener">Yandex</a>');
    markers.push(m);
    var btn=document.createElement('button');btn.type='button';
    btn.innerHTML='<strong>'+p.name+'</strong><span>'+p.cat+' · haritada göster</span>';
    btn.onclick=function(){map.setView([p.lat,p.lng],14);markers[i].openPopup();};
    list.appendChild(btn);
  });
  try{map.fitBounds(L.featureGroup(markers).getBounds().pad(0.12));}catch(e){}
})();
</script>
<script src="assets/js/app.js" defer></script>
</body>
</html>
