<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d7a4f">
<meta name="description" content="KonyaGo duyurular ve sponsor bilgilendirmeleri.">
<title>Duyurular | KonyaGo</title>
<link rel="icon" href="assets/img/eagle.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/app.css?v=20">
<link rel="stylesheet" href="assets/css/sponsor.css?v=1">
<style>
.duyuru-sponsor{
  background:linear-gradient(145deg,#fff9e8,#fff,#f3e7c7);
  border:1px solid rgba(201,162,39,.5);
  border-radius:16px;
  padding:16px 16px 18px;
  margin-bottom:12px;
  box-shadow:0 8px 24px rgba(138,112,16,.08);
}
.duyuru-sponsor .ad-label{
  display:inline-block;font-size:.62rem;font-weight:800;letter-spacing:.06em;
  text-transform:uppercase;color:#8a7010;background:rgba(201,162,39,.18);
  padding:2px 8px;border-radius:999px;margin-bottom:8px;
}
.duyuru-sponsor h2{color:#5c4a0e;font-size:1.05rem;margin-bottom:6px}
.duyuru-sponsor .date{font-size:.75rem;color:#8a7010;font-weight:700;margin-bottom:8px}
.duyuru-sponsor p{font-size:.9rem;color:#5a4a2a;margin-bottom:12px;line-height:1.5}
.duyuru-sponsor a.cta{
  display:inline-flex;align-items:center;gap:6px;padding:10px 16px;border-radius:999px;
  background:linear-gradient(135deg,#8a7010,#c9a227);color:#fff!important;
  font-weight:800;font-size:.88rem;text-decoration:none;
}
.duyuru-sponsor a.cta:hover{filter:brightness(1.05)}
</style>
</head>
<body>
<header class="site-header">
  <div class="container header-inner">
    <a class="logo" href="index.html"><img class="logo-mark" src="assets/img/eagle.svg" width="44" height="44" alt=""><span class="logo-text"><strong>KonyaGo</strong><small>Şehir rehberi</small></span></a>
    <nav class="nav-desktop" aria-label="Ana menü">
      <a href="index.html">Ana</a>
      <a href="duyurular.html" aria-current="page">Duyurular</a>
      <a href="gizlilik.html">Gizlilik</a>
      <a href="iletisim.html">İletişim</a>
    </nav>
  </div>
</header>
<main class="container">
  <div class="page-head">
    <a href="index.html">← Ana sayfa</a>
    <h1>Duyurular</h1>
    <p>Güncellemeler ve sponsor bilgilendirmeleri.</p>
  </div>

  <div id="duyuruList"></div>

  <p class="note" style="margin-top:16px"><a href="gizlilik.html">Gizlilik & KVKK</a> · <a href="reklam.html">Reklam / iş birliği</a></p>
</main>
<footer class="site-footer"><div class="container">© 2026 KonyaGo · <a href="gizlilik.html">Gizlilik</a></div></footer>
<nav class="mnav" aria-label="Mobil menü">
  <a href="index.html"><span class="i">🏠</span>Ana</a>
  <a href="duyurular.html" aria-current="page"><span class="i">📢</span>Duyuru</a>
  <a href="gezilecek.html"><span class="i">🕌</span>Gezi</a>
  <a href="gizlilik.html"><span class="i">🔒</span>Gizlilik</a>
  <a href="iletisim.html"><span class="i">✉️</span>İletişim</a>
</nav>
<script src="assets/js/duyurular.js"></script>
<script src="assets/js/app.js?v=20" defer></script>
<script>
(function () {
  var box = document.getElementById("duyuruList");
  var D = window.KONYAGO_DUYURULAR;
  if (!box || !D) return;
  (D.items || []).forEach(function (it) {
    var el = document.createElement("article");
    if (it.sponsor) {
      el.className = "duyuru-sponsor";
      el.innerHTML =
        '<span class="ad-label">Sponsor</span>' +
        "<h2>" + it.title + "</h2>" +
        '<p class="date">' + it.date + "</p>" +
        "<p>" + it.body + "</p>" +
        (it.href
          ? '<a class="cta" href="' + it.href + '" target="_blank" rel="noopener sponsored">' +
            (it.cta || "İncele") +
            " →</a>"
          : "");
    } else {
      el.className = "info";
      el.innerHTML =
        "<h2>" +
        it.title +
        '</h2><p style="font-size:.75rem;color:var(--gold);font-weight:700;margin-bottom:6px">' +
        it.date +
        "</p><p>" +
        it.body +
        "</p>";
    }
    box.appendChild(el);
  });
})();
</script>
</body>
</html>
