<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d7a4f">
<meta name="description" content="KonyaGo AI — Yerel Konya asistanı.">
<title>KonyaGo AI | Yerel Asistan</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/img/eagle.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/app.css?v=23">
<link rel="stylesheet" href="assets/css/theme.css?v=3">
<style>
.ai-wrap{max-width:720px;margin:0 auto}
.ai-panel{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;height:min(72vh,600px);color:var(--text)}
.ai-head{background:linear-gradient(135deg,var(--green-dark),var(--green));color:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.ai-head img{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.12)}
.ai-head strong{display:block;font-size:1rem;color:#fff}
.ai-head span{font-size:.75rem;opacity:.95;color:#fff}
#aiChat{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--cream);color:var(--text)}
.ai-msg{max-width:90%;padding:10px 14px;border-radius:14px;font-size:.9rem;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.ai-bot{align-self:flex-start;background:#fff;border:1px solid rgba(13,122,79,.22);color:#1a2e24!important;border-bottom-left-radius:4px}
.ai-bot *{color:#1a2e24!important}
.ai-user{align-self:flex-end;background:#0d7a4f;color:#fff!important;border-bottom-right-radius:4px}
.ai-user *{color:#fff!important}
.ai-meta{font-size:.68rem;opacity:.75;margin-top:4px}
.ai-typing{opacity:.85;font-style:italic}
#aiForm{display:flex;gap:8px;padding:10px;border-top:1px solid var(--border);background:var(--white)}
#aiInput{flex:1;border:1.5px solid var(--border);border-radius:999px;padding:12px 16px;font:inherit;font-size:.92rem;outline:none;min-height:44px;background:var(--white);color:var(--text)}
#aiInput::placeholder{color:var(--muted);opacity:1}
#aiInput:focus{border-color:var(--green)}
#aiSend{border:none;border-radius:999px;padding:0 18px;background:var(--green);color:#fff;font-weight:700;cursor:pointer;min-height:44px;font-family:inherit}
#aiSend:disabled{opacity:.5}
.ai-hints{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0}
.ai-hints button{border:1px solid var(--border);background:var(--white);border-radius:999px;padding:8px 12px;font-size:.78rem;font-weight:600;color:#063d28;cursor:pointer;font-family:inherit}
.ai-hints button:hover{background:var(--green-soft)}
.ai-hints button.hint-hot{background:linear-gradient(135deg,var(--green-soft),var(--gold-soft));border-color:rgba(13,122,79,.35);color:#063d28}
html[data-theme="dark"] #aiChat{background:linear-gradient(180deg,#0e1813,#12201a)}
html[data-theme="dark"] .ai-bot{background:#1a2e24!important;border-color:rgba(62,207,142,.3)!important;color:#e8f0eb!important}
html[data-theme="dark"] .ai-bot *{color:#e8f0eb!important}
html[data-theme="dark"] .ai-user{background:#2aad72!important;color:#fff!important}
html[data-theme="dark"] #aiForm{background:#16241c;border-top-color:rgba(62,207,142,.22)}
html[data-theme="dark"] #aiInput{background:#12201a;color:#e8f0eb;border-color:rgba(62,207,142,.28)}
html[data-theme="dark"] #aiInput::placeholder{color:#9bb5a8}
html[data-theme="dark"] .ai-hints button{background:#16241c;color:#3ecf8e;border-color:rgba(62,207,142,.28)}
html[data-theme="dark"] .ai-hints button.hint-hot{background:linear-gradient(135deg,#143d2c,#3d3420);color:#e8f0eb;border-color:rgba(224,195,92,.35)}
</style>
</head>
<body>
<header class="site-header">
  <div class="container header-inner">
    <a class="logo" href="index.html">
      <img class="logo-mark" src="assets/img/eagle.svg" width="44" height="44" alt="">
      <span class="logo-text"><strong>KonyaGo</strong><small>Şehir rehberi</small></span>
    </a>
    <nav class="nav-desktop" aria-label="Ana menü">
      <a href="index.html">Ana</a>
      <a href="ai.html" aria-current="page">AI</a>
      <a href="gezilecek.html">Gezilecek</a>
      <a href="rotalar.html">Rotalar</a>
      <a href="en.html">EN</a>
    </nav>
  </div>
</header>

<main class="container">
  <div class="page-head">
    <a href="index.html">← Ana sayfa</a>
    <h1>KonyaGo AI</h1>
    <p>Yerel Konya asistanı — anında yanıt</p>
  </div>

  <div class="ai-wrap">
    <div class="ai-panel">
      <div class="ai-head">
        <img src="assets/img/eagle.svg" alt="">
        <div>
          <strong>KonyaGo AI</strong>
          <span>Yerel motor · Konya-only</span>
        </div>
      </div>
      <div id="aiChat" aria-live="polite"></div>
      <form id="aiForm" autocomplete="off">
        <input id="aiInput" type="text" placeholder="Konya hakkında sor…" maxlength="800" enterkeyhint="send">
        <button type="submit" id="aiSend">Gönder</button>
      </form>
    </div>
    <div class="ai-hints">
      <button type="button" class="hint-hot" data-q="Hafta sonu planı">🗓️ Hafta sonu planı</button>
      <button type="button" data-q="1 günde ne gezilir?">1 günde ne gezilir?</button>
      <button type="button" data-q="Mevlana ücretsiz mi, saat kaçta kapanıyor?">Mevlana</button>
      <button type="button" data-q="Etli ekmek nedir, nerede yenir?">Etli ekmek</button>
      <button type="button" data-q="Sille’ye nasıl gidilir?">Sille</button>
      <button type="button" data-q="Eşrefoğulları nedir?">Eşrefoğulları</button>
      <button type="button" data-q="ATUS ve Konyakart nasıl kullanılır?">Ulaşım</button>
    </div>
  </div>
</main>

<footer class="site-footer"><div class="container">© 2026 KonyaGo AI</div></footer>
<nav class="mnav" aria-label="Mobil menü">
  <a href="index.html"><span class="i">🏠</span>Ana</a>
  <a href="ai.html" aria-current="page"><span class="i">✨</span>AI</a>
  <a href="gezilecek.html"><span class="i">🕌</span>Gezi</a>
  <a href="mutfak.html"><span class="i">🍽️</span>Mutfak</a>
  <a href="harita.html"><span class="i">🗺️</span>Harita</a>
</nav>
<script src="assets/js/theme.js?v=2"></script>
<script src="assets/js/app.js?v=23" defer></script>
<script src="assets/js/ai.js?v=11" defer></script>
<script>
document.querySelectorAll(".ai-hints button").forEach(function(b){
  b.addEventListener("click",function(){
    var input=document.getElementById("aiInput");
    var form=document.getElementById("aiForm");
    if(!input||!form)return;
    input.value=b.getAttribute("data-q")||"";
    form.requestSubmit();
  });
});
</script>
</body>
</html>
