<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d7a4f">
<meta name="description" content="KonyaGo AI — Konya odaklı sınırsız gezi asistanı.">
<title>KonyaGo AI | Konya Asistanı</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/img/eagle.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/app.css">
<style>
.ai-wrap{max-width:720px;margin:0 auto}
.ai-panel{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;height:min(70vh,560px)}
.ai-head{background:linear-gradient(135deg,var(--green-dark),var(--green));color:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px}
.ai-head img{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.12)}
.ai-head strong{display:block;font-size:1rem}
.ai-head span{font-size:.75rem;opacity:.9}
#aiChat{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;background:linear-gradient(180deg,#f7faf8,#eef6f1)}
.ai-msg{max-width:88%;padding:10px 14px;border-radius:14px;font-size:.9rem;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.ai-bot{align-self:flex-start;background:#fff;border:1px solid var(--border);color:var(--text);border-bottom-left-radius:4px}
.ai-user{align-self:flex-end;background:var(--green);color:#fff;border-bottom-right-radius:4px}
.ai-typing{opacity:.7;font-style:italic}
#aiForm{display:flex;gap:8px;padding:10px;border-top:1px solid var(--border);background:#fff}
#aiInput{flex:1;border:1px solid var(--border);border-radius:999px;padding:12px 16px;font:inherit;font-size:.92rem;outline:none;min-height:44px}
#aiInput:focus{border-color:var(--green)}
#aiSend{border:none;border-radius:999px;padding:0 18px;background:var(--green);color:#fff;font-weight:700;cursor:pointer;min-height:44px;font-family:inherit}
#aiSend:disabled{opacity:.5}
.ai-hints{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0}
.ai-hints button{border:1px solid var(--border);background:var(--white);border-radius:999px;padding:8px 12px;font-size:.78rem;font-weight:600;color:var(--green-dark);cursor:pointer;font-family:inherit}
.ai-hints button:hover{background:var(--green-soft)}
.ai-hints button.hint-hot{background:linear-gradient(135deg,#e8f5ee,#f5ecd0);border-color:rgba(13,122,79,.35)}
</style>
</head>
<body>
<header class="site-header">
  <div class="container header-inner">
    <a class="logo" href="index.html">
      <img class="logo-mark" src="assets/img/eagle.svg" width="44" height="44" alt="">
      <span class="logo-text"><strong>KonyaGo</strong><small>Şehir rehberi</small></span>
    </a>
    <nav class="nav-desktop" aria-label="Ana menü">
      <a href="index.html">Ana</a>
      <a href="ai.html" aria-current="page">AI</a>
      <a href="gezilecek.html">Gezilecek</a>
      <a href="rotalar.html">Rotalar</a>
      <a href="en.html">EN</a>
    </nav>
  </div>
</header>

<main class="container">
  <div class="page-head">
    <a href="index.html">← Ana sayfa</a>
    <h1>KonyaGo AI</h1>
    <p>Konya’ya özel asistan — sınırsız soru.</p>
  </div>

  <div class="ai-wrap">
    <div class="ai-panel">
      <div class="ai-head">
        <img src="assets/img/eagle.svg" alt="">
        <div><strong>KonyaGo AI</strong><span>Konya asistanı · limit yok</span></div>
      </div>
      <div id="aiChat" aria-live="polite"></div>
      <form id="aiForm" autocomplete="off">
        <input id="aiInput" type="text" placeholder="Konya hakkında sor…" maxlength="500" enterkeyhint="send">
        <button type="submit" id="aiSend">Gönder</button>
      </form>
    </div>
    <div class="ai-hints">
      <button type="button" class="hint-hot" data-q="Hafta sonu planı">🗓️ Hafta sonu planı</button>
      <button type="button" data-q="1 günde ne gezilir?">1 günde ne gezilir?</button>
      <button type="button" data-q="Etli ekmek nedir?">Etli ekmek</button>
      <button type="button" data-q="Sille’ye nasıl gidilir?">Sille</button>
      <button type="button" data-q="Mevlana ücretsiz mi?">Mevlana</button>
      <button type="button" data-q="ATUS nasıl kullanılır?">Ulaşım</button>
    </div>
  </div>

  <div class="info" style="margin-top:16px">
    <h2>İlgili</h2>
    <div class="link-row">
      <a class="btn btn-ghost btn-sm" href="rota-yazdir.html">Yazdırılabilir rota</a>
      <a class="btn btn-ghost btn-sm" href="rotalar.html">Rotalar</a>
      <a class="btn btn-ghost btn-sm" href="ilceler.html">İlçeler</a>
    </div>
  </div>
</main>

<footer class="site-footer"><div class="container">© 2026 KonyaGo</div></footer>
<nav class="mnav" aria-label="Mobil menü">
  <a href="index.html"><span class="i">🏠</span>Ana</a>
  <a href="ai.html" aria-current="page"><span class="i">✨</span>AI</a>
  <a href="gezilecek.html"><span class="i">🕌</span>Gezi</a>
  <a href="mutfak.html"><span class="i">🍽️</span>Mutfak</a>
  <a href="harita.html"><span class="i">🗺️</span>Harita</a>
</nav>
<script src="assets/js/app.js" defer></script>
<script src="assets/js/ai.js" defer></script>
<script>
document.querySelectorAll(".ai-hints button").forEach(function(b){
  b.addEventListener("click",function(){
    var input=document.getElementById("aiInput");
    var form=document.getElementById("aiForm");
    if(!input||!form)return;
    input.value=b.getAttribute("data-q")||"";
    form.requestSubmit();
  });
});
</script>
</body>
</html>
