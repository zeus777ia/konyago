<style>
.ai-wrap{max-width:720px;margin:0 auto}
.ai-panel{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;height:min(72vh,600px);color:var(--text)}
.ai-head{background:linear-gradient(135deg,#0A1628,#152A42);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:1px solid rgba(201,162,39,.3)}
.ai-head img{width:40px;height:40px;border-radius:10px;object-fit:cover}
.ai-head strong{display:block;font-size:1rem;color:#E8C84A}
.ai-head span{font-size:.75rem;opacity:.95;color:#D4DBE6}
#aiChat{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;background:#0A1628;color:var(--text)}
.ai-msg{max-width:90%;padding:10px 14px;border-radius:14px;font-size:.9rem;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.ai-bot{align-self:flex-start;background:#152A42;border:1px solid rgba(201,162,39,.25);color:#F5F2EB!important;border-bottom-left-radius:4px}
.ai-bot *{color:#F5F2EB!important}
.ai-user{align-self:flex-end;background:#C9A227;color:#0A1628!important;border-bottom-right-radius:4px}
.ai-user *{color:#0A1628!important}
.ai-meta{font-size:.68rem;opacity:.75;margin-top:4px}
.ai-typing{opacity:.85;font-style:italic}
#aiForm{display:flex;gap:8px;padding:10px;border-top:1px solid rgba(201,162,39,.25);background:#152A42}
#aiInput{flex:1;border:1.5px solid rgba(201,162,39,.25);border-radius:999px;padding:12px 16px;font:inherit;font-size:.92rem;outline:none;min-height:44px;background:#0A1628;color:#F5F2EB}
#aiInput::placeholder{color:#B8C2CE;opacity:1}
#aiInput:focus{border-color:#C9A227}
#aiSend{border:none;border-radius:999px;padding:0 18px;background:#C9A227;color:#0A1628;font-weight:700;cursor:pointer;min-height:44px;font-family:inherit}
#aiSend:disabled{opacity:.5}
.ai-hints{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0}
.ai-hints button{border:1px solid rgba(201,162,39,.3);background:#152A42;border-radius:999px;padding:8px 12px;font-size:.78rem;font-weight:600;color:#E8C84A;cursor:pointer;font-family:inherit}
.ai-hints button:hover{background:#1A3050}
.ai-hints button.hint-hot{background:linear-gradient(135deg,rgba(201,162,39,.2),#152A42);border-color:rgba(201,162,39,.5)}
</style>

<main class="container">
  <div class="page-head">
    <a href="index.html">← Ana sayfa</a>
    <h1>KonyaGo AI</h1>
    <p>Yerel Konya asistanı — anında yanıt</p>
  </div>
  <div class="ai-wrap">
    <div class="ai-panel">
      <div class="ai-head">
        <img src="assets/img/IMG_0510.jpeg" alt="">
        <div>
          <strong>KonyaGo AI</strong>
          <span>Yerel motor · Konya-only</span>
        </div>
      </div>
      <div id="aiChat" aria-live="polite"></div>
      <form id="aiForm" autocomplete="off">
        <input id="aiInput" type="text" placeholder="Konya hakkında sor…" maxlength="800" enterkeyhint="send">
        <button type="submit" id="aiSend">Gönder</button>
      </form>
    </div>
    <div class="ai-hints">
      <button type="button" class="hint-hot" data-q="Hafta sonu planı">🗓️ Hafta sonu planı</button>
      <button type="button" data-q="1 günde ne gezilir?">1 günde ne gezilir?</button>
      <button type="button" data-q="Mevlana ücretsiz mi, saat kaçta kapanıyor?">Mevlana</button>
      <button type="button" data-q="Etli ekmek nedir, nerede yenir?">Etli ekmek</button>
      <button type="button" data-q="Sille’ye nasıl gidilir?">Sille</button>
      <button type="button" data-q="Eşrefoğulları nedir?">Eşrefoğulları</button>
      <button type="button" data-q="ATUS ve Konyakart nasıl kullanılır?">Ulaşım</button>
    </div>
  </div>

<script>
document.querySelectorAll(".ai-hints button").forEach(function(b){
  b.addEventListener("click",function(){
    var input=document.getElementById("aiInput");
    var form=document.getElementById("aiForm");
    if(!input||!form)return;
    input.value=b.getAttribute("data-q")||"";
    form.requestSubmit();
  });
});
</script>
