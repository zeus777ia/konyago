<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Selcuklu cift basli kartal">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c9a227" stop-opacity=".35"/>
      <stop offset="70%" stop-color="#0d7a4f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0e6b8"/>
      <stop offset="40%" stop-color="#c9a227"/>
      <stop offset="100%" stop-color="#8a7010"/>
    </linearGradient>
  </defs>
  <!-- soft glow -->
  <circle cx="100" cy="100" r="96" fill="url(#glow)"/>
  <!-- dark disc -->
  <circle cx="100" cy="100" r="88" fill="#0a0f0c"/>
  <circle cx="100" cy="100" r="86" fill="none" stroke="url(#gold)" stroke-width="2.5"/>
  <!-- 8-point star (Rub el Hizb style) -->
  <path fill="none" stroke="url(#gold)" stroke-width="3.5" stroke-linejoin="round"
    d="M100 22 L118 62 L162 54 L138 92 L170 122 L122 122 L100 168 L78 122 L30 122 L62 92 L38 54 L82 62 Z"/>
  <path fill="none" stroke="url(#gold)" stroke-width="1.2" opacity=".5"
    d="M100 32 L114 64 L150 58 L132 90 L158 116 L122 116 L100 152 L78 116 L42 116 L68 90 L50 58 L86 64 Z"/>
  <!-- double-headed eagle -->
  <g fill="url(#gold)" stroke="#5c4a08" stroke-width=".6" stroke-linejoin="round">
    <!-- body -->
    <ellipse cx="100" cy="108" rx="14" ry="20"/>
    <!-- left wing -->
    <path d="M88 100 C70 88 52 92 42 108 C58 102 72 108 88 112 Z"/>
    <path d="M86 108 C68 104 54 112 48 124 C62 116 74 116 86 114 Z" opacity=".9"/>
    <!-- right wing -->
    <path d="M112 100 C130 88 148 92 158 108 C142 102 128 108 112 112 Z"/>
    <path d="M114 108 C132 104 146 112 152 124 C138 116 126 116 114 114 Z" opacity=".9"/>
    <!-- left head -->
    <circle cx="90" cy="82" r="11"/>
    <path d="M82 80 L72 74 L82 86 Z"/>
    <!-- right head -->
    <circle cx="110" cy="82" r="11"/>
    <path d="M118 80 L128 74 L118 86 Z"/>
    <!-- crown feather between heads -->
    <path d="M96 74 L100 64 L104 74 Z"/>
    <!-- tail -->
    <path d="M90 124 L100 148 L110 124 Q100 130 90 124 Z"/>
    <!-- legs / claws -->
    <path d="M94 126 L90 140 L96 138 Z"/>
    <path d="M106 126 L110 140 L104 138 Z"/>
  </g>
  <circle cx="87" cy="80" r="2.2" fill="#0a0f0c"/>
  <circle cx="107" cy="80" r="2.2" fill="#0a0f0c"/>
</svg>
