    <path d="M40 40 L32 36 L40 44 Z"/>
    <!-- right head -->
    <circle cx="72" cy="42" r="10"/>
    <path d="M80 40 L88 36 L80 44 Z"/>
    <!-- tail -->
    <path d="M54 84 L60 98 L66 84 Z"/>
  </g>
  <circle cx="45" cy="40" r="2" fill="#0a5c3a"/>
  <circle cx="69" cy="40" r="2" fill="#0a5c3a"/>
