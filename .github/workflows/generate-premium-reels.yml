name: Generate KonyaGo Premium Reels

on:
  push:
    branches: [main]
    paths:
      - 'scripts/generate_social_assets.py'
      - 'scripts/generate_premium_reels.py'
      - '.github/workflows/generate-premium-reels.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-konyago-premium-reels
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install media dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation2
          python -m pip install --upgrade pip
          python -m pip install numpy pillow

      - name: Render original premium reels
        run: python scripts/generate_premium_reels.py media/social

      - name: Verify rendered media
        run: |
          test -s media/social/konyago-3-soru-premium-reel.mp4
          test -s media/social/konyago-misafir-3-saat-premium-reel.mp4
          ffprobe -v error -show_entries format=duration -of default=nw=1 media/social/konyago-3-soru-premium-reel.mp4
          ffprobe -v error -show_entries format=duration -of default=nw=1 media/social/konyago-misafir-3-saat-premium-reel.mp4

      - name: Commit generated media
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add media/social
          if git diff --cached --quiet; then
            echo 'Generated media is already current.'
          else
            git commit -m 'media: render premium KonyaGo reels'
            git push origin HEAD:main
          fi

      - name: Upload workflow copy
        uses: actions/upload-artifact@v4
        with:
          name: konyago-premium-reels
          path: media/social
          retention-days: 30
