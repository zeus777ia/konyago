name: Generate favicons
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/write_brand_favicons.py"
      - ".github/workflows/favicons.yml"
jobs:
  gen:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Write brand favicons
        run: python3 scripts/write_brand_favicons.py
      - name: Commit favicons
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update favicons to new KonyaGo brand icon"
          file_pattern: "favicon.ico assets/img/favicon-*.png assets/img/apple-touch-icon.png"
